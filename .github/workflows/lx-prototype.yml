name: LX isolation prototype

on:
  push:
    branches: [develop, 'test-*']
    paths:
      - 'tool/lx_prototype/**'
      - '.github/workflows/lx-prototype.yml'
      - 'android/gradle/wrapper/**'
  pull_request:
    paths:
      - 'tool/lx_prototype/**'
      - '.github/workflows/lx-prototype.yml'
      - 'android/gradle/wrapper/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motif-lx-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-network:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Locate OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          if (!(Test-Path -LiteralPath $openssl -PathType Leaf)) { throw 'OpenSSL is missing' }
          "MOTIF_TEST_OPENSSL=$openssl" >> $env:GITHUB_ENV
      - name: Verify LX host policy, Range and cancellation
        run: node --test tool/lx_prototype/host_network/broker.test.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run stand-alone Windows checks
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'motif-lx'
          $library = Join-Path $probe 'media fixture/libmpv.dll'
          $build = Join-Path $probe 'build'
          cmake "-DMOTIF_MPV_PLATFORM=windows-x64" "-DMOTIF_MPV_OUTPUT=$library" -P tool/lx_prototype/fetch_mpv.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tool/lx_prototype -B $build -A x64 "-DMOTIF_LX_MPV_DLL=$library"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build -C Release --output-on-failure --no-tests=error

      - name: Stage and verify the portable Windows probes
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'motif-lx'
          $build = Join-Path $probe 'build/Release'
          $library = Join-Path $probe 'media fixture/libmpv.dll'
          $package = Join-Path $probe 'windows probe package'
          cmake "-DMOTIF_LX_WINDOWS_BUILD=$build" "-DMOTIF_LX_WINDOWS_PACKAGE=$package" "-DMOTIF_LX_MPV_DLL=$library" "-DMOTIF_LX_SOURCE_COMMIT=$env:GITHUB_SHA" -P tool/lx_prototype/package_windows.cmake

      - name: Upload the portable Windows probes and test output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: motif-lx-windows-prototype
          path: ${{ runner.temp }}/motif-lx/windows probe package/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android fixture dependencies
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          cmdline="$sdk/cmdline-tools/latest/bin"
          if [[ ! -x "$cmdline/sdkmanager" || ! -x "$cmdline/avdmanager" ]]; then
            echo "::error::Android SDK command-line tools are missing from $cmdline"
            exit 1
          fi
          "$cmdline/sdkmanager" --sdk_root="$sdk" 'platforms;android-36' 'platform-tools' 'ndk;28.2.13676358' 'cmake;3.22.1' 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          printf '%s\n' "$cmdline" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"
          cmake -DMOTIF_MPV_PLATFORM=android-x86_64 "-DMOTIF_MPV_OUTPUT=$RUNNER_TEMP/motif-lx/jni/x86_64/libmpv_audio_kit.so" -P tool/lx_prototype/fetch_mpv.cmake
          cmake -DMOTIF_MPV_PLATFORM=android-arm64 "-DMOTIF_MPV_OUTPUT=$RUNNER_TEMP/motif-lx/jni/arm64-v8a/libmpv_audio_kit.so" -P tool/lx_prototype/fetch_mpv.cmake
      - name: Build the standalone probe and instrumentation APKs
        run: |
          bash android/gradlew -p tool/lx_prototype/android "-PmotifLxMediaLibs=$RUNNER_TEMP/motif-lx/jni" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify Android process isolation and controlled media
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/motif-lx/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n motif-lx -p "$ANDROID_AVD_HOME/motif-lx.avd" -k 'system-images;android-35;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/motif-lx.ini"
          emulator -list-avds | grep -Fx 'motif-lx'
          emulator -accel-check
          serial=emulator-5554
          log="$RUNNER_TEMP/motif-lx/emulator.log"
          emulator -avd motif-lx -port 5554 -accel on -no-snapshot -no-window -no-audio -gpu software -no-boot-anim >"$log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            local result=$?
            if (( result != 0 )); then
              tail -n 50 "$log" || true
              timeout 10 adb -s "$serial" logcat -d -s MotifLxProbe:V || true
            fi
            timeout 10 adb -s "$serial" emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
            return "$result"
          }
          trap cleanup EXIT
          booted=0
          for attempt in {1..90}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Android emulator exited before boot"
              exit 1
            fi
            if [[ "$(timeout 3 adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          if (( booted == 0 )); then
            echo "::error::Android emulator did not boot within the test window"
            exit 1
          fi
          adb -s "$serial" install tool/lx_prototype/android/app/build/outputs/apk/debug/app-debug.apk
          adb -s "$serial" install tool/lx_prototype/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 120 adb -s "$serial" shell am instrument -w -r com.alizesa.motif.lxprobe.test/com.alizesa.motif.lxprobe.IsolationInstrumentation | tee "$RUNNER_TEMP/motif-lx/instrumentation.log"
          grep -Eq '^(INSTRUMENTATION_RESULT: stream=)?PASS Motif LX Android isolation and controlled media$' <(tr -d '\r' <"$RUNNER_TEMP/motif-lx/instrumentation.log")
          grep -Fqx 'INSTRUMENTATION_CODE: -1' <(tr -d '\r' <"$RUNNER_TEMP/motif-lx/instrumentation.log")
      - name: Upload prototype APKs and test output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: motif-lx-android-prototype
          path: |
            tool/lx_prototype/android/app/build/outputs/apk/debug/app-debug.apk
            tool/lx_prototype/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            ${{ runner.temp }}/motif-lx/instrumentation.log
          if-no-files-found: error
